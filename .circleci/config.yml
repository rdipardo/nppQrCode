orbs:
  lazarus: rdipardo/lazarus@4
  win: circleci/windows@5

references:
  executor: &executor
    executor:
      name: win/default
      shell: bash.exe
  development: &development
    filters:
      tags:
        only: /v.*/
  production: &production
    context:
      - azure
      - gh-release-authoring
    filters:
      branches:
        ignore: /.*/
      tags:
        only: /v.*/

parameters:
  plugin-name:
    type: string
    default: NppQrCode

jobs:
  build:
    <<: *executor
    environment:
      UPX_VER: 5.2.1
      UPX_DIR: "C:\\upx"
    steps:
      - checkout
      - run:
          name: Clone submodules
          command: |
            git submodule sync --recursive
            git submodule update --init --recursive
      - lazarus/install:
          win32: true
      - run:
          name: Install UPX
          command: |
            rm -f lazpath.txt
            mkdir -p "$UPX_DIR"
            curl -sLO "https://github.com/upx/upx/releases/download/v$UPX_VER/upx-$UPX_VER-win64.zip"
            7z e upx-$UPX_VER-win64.zip -o"$UPX_DIR"
            "$UPX_DIR\\upx.exe" --version
      - run:
         name: Make Release Bundles
         command: .\lazarus\make_release.cmd
         shell: cmd.exe
      - unless:
          condition:
            matches:
              pattern: 'v.*'
              value:   << pipeline.git.tag >>
          steps:
            - run:
               name: Pack Release Artifacts
               command: |
                 "$UPX_DIR\\upx.exe" "bin\\i386-win32\\Release\\<< pipeline.parameters.plugin-name >>32.dll"
                 "$UPX_DIR\\upx.exe" "bin\\x86_64-win64\\Release\\<< pipeline.parameters.plugin-name >>64.dll"
                 7z a -tzip << pipeline.parameters.plugin-name >>64.zip ./bin/x86_64-win64/Release/<< pipeline.parameters.plugin-name >>64.dll
                 7z a -tzip << pipeline.parameters.plugin-name >>32.zip ./bin/i386-win32/Release/<< pipeline.parameters.plugin-name >>32.dll
            - store_artifacts:
                name: Upload << pipeline.parameters.plugin-name >>32.zip
                path: << pipeline.parameters.plugin-name >>32.zip
                destination: << pipeline.parameters.plugin-name >>32.zip
            - store_artifacts:
                name: Upload << pipeline.parameters.plugin-name >>64.zip
                path: << pipeline.parameters.plugin-name >>64.zip
                destination: << pipeline.parameters.plugin-name >>64.zip
      - persist_to_workspace:
          root: .
          paths: bin

  push_release:
    <<: *executor
    steps:
      - checkout:
          method: full
      - attach_workspace:
          at: .
      - run:
          name: Create GitHub Release
          command: bash.exe .circleci/scripts/gh_release.sh
          environment:
            SLUGX86: << pipeline.parameters.plugin-name >>-<< pipeline.git.tag >>-win32.zip
            SLUGX64: << pipeline.parameters.plugin-name >>-<< pipeline.git.tag >>-x64.zip
            BIN_DIR: bin

  sign_artifacts:
    <<: *executor
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      PLUGIN_x86_DLL: ./bin/i386-win32/Release/<< pipeline.parameters.plugin-name >>32.dll
      PLUGIN_x64_DLL: ./bin/x86_64-win64/Release/<< pipeline.parameters.plugin-name >>64.dll
      SLUG_x86: ./bin/<< pipeline.parameters.plugin-name >>-<< pipeline.git.tag >>-win32.zip
      SLUG_x64: ./bin/<< pipeline.parameters.plugin-name >>-<< pipeline.git.tag >>-x64.zip
    steps:
      - checkout:
          method: full
      - attach_workspace:
          at: .
      - run:
          name: Install code signing CLI tool
          command: dotnet tool install -g --prerelease sign
      - run:
          name: Login to Azure
          shell: powershell.exe
          command: |
            az login `
                --service-principal `
                --user "${env:AZURE_CLIENT_ID}" `
                --tenant "${env:AZURE_TENANT_ID}" `
                --federated-token "${env:CIRCLE_OIDC_TOKEN}" | Out-Null
      - run:
          name: Sign release artifacts
          shell: powershell.exe
          command: |
            sign code artifact-signing `
                --azure-credential-type azure-cli `
                --verbosity warning `
                --timestamp-url http://timestamp.acs.microsoft.com `
                --artifact-signing-endpoint https://ncus.codesigning.azure.net `
                --artifact-signing-account devcerts `
                --artifact-signing-certificate-profile gha-artifact-signing `
                "$env:PLUGIN_x86_DLL" `
                "$env:PLUGIN_x64_DLL"
      - run:
          name: Pack release archives
          command: |
            rm -f ./bin/*.zip
            7z a -tzip "${env:SLUG_x86}" "${env:PLUGIN_x86_DLL}" CHANGELOG.md README.md ./bin/Copyright -y
            7z a -tzip "${env:SLUG_x64}" "${env:PLUGIN_x64_DLL}" CHANGELOG.md README.md ./bin/Copyright -y
      - store_artifacts:
          name: Upload << pipeline.parameters.plugin-name >>-<< pipeline.git.tag >>-win32.zip
          path: bin/<< pipeline.parameters.plugin-name >>-<< pipeline.git.tag >>-win32.zip
          destination: << pipeline.parameters.plugin-name >>-<< pipeline.git.tag >>-win32.zip
      - store_artifacts:
          name: Upload << pipeline.parameters.plugin-name >>-<< pipeline.git.tag >>-x64.zip
          path: bin/<< pipeline.parameters.plugin-name >>-<< pipeline.git.tag >>-x64.zip
          destination: << pipeline.parameters.plugin-name >>-<< pipeline.git.tag >>-x64.zip
      - persist_to_workspace:
          root: .
          paths: bin

workflows:
  lazarus_build:
    jobs:
      - build:
          <<: *development
      - sign_artifacts:
          <<: *production
          requires:
            - build
      - push_release:
          <<: *production
          requires:
            - sign_artifacts
